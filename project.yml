# PfamIE Xcode project, generated by XcodeGen.
#
# Regenerate with `Tools/generate-project.sh` after changing this file. The
# .xcodeproj is not committed: it is derived, and a hand-edited pbxproj is how
# a five-target project quietly diverges from what anyone thinks it contains.
name: PfamIE
options:
  bundleIdPrefix: com.mdeller
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: SYNV8TWB5Z
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Assets are the size of the app. Nothing here should be recompressed or
    # thinned: the .bin matrices are read by mmap and must survive byte-exact.
    ASSETCATALOG_COMPILER_OPTIMIZATION: space
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Distribution
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  PfamIEKit:
    path: PfamIEKit

targetTemplates:
  ForgeAssets:
    sources:
      - path: assets/bundle
        type: folder
        optional: true
        buildPhase: resources
      - path: assets/coreml/PfamIEProteinEmbedder.mlpackage
        optional: true
      - path: assets/coreml/PfamIETextEmbedder.mlpackage
        optional: true
      - path: assets/coreml/minilm_vocab.txt
        optional: true
        buildPhase: resources

targets:

  PfamIE:
    type: application
    platform: iOS
    templates: [ForgeAssets]
    supportedDestinations: [iOS]
    deviceFamily: [iPhone, iPad]
    sources:
      - Apps/iOS
    dependencies:
      - package: PfamIEKit
      - target: PfamIE-watchOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.pfamie
        INFOPLIST_FILE: Apps/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: PfamIE App Store

  PfamIE-macOS:
    type: application
    platform: macOS
    templates: [ForgeAssets]
    sources:
      - Apps/macOS
    dependencies:
      - package: PfamIEKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.pfamie
        PRODUCT_NAME: PfamIE
        INFOPLIST_FILE: Apps/macOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/PfamIE.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: PfamIE macOS App Store

  PfamIE-visionOS:
    type: application
    platform: visionOS
    templates: [ForgeAssets]
    sources:
      - Apps/visionOS
    dependencies:
      - package: PfamIEKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.pfamie
        PRODUCT_NAME: PfamIE
        INFOPLIST_FILE: Apps/visionOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: PfamIE visionOS App Store

  # The watch companion carries no model and no matrices: the phone classifies
  # and sends the result across. Nothing here needs 150 MB of assets.
  PfamIE-watchOS:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS
    dependencies:
      - package: PfamIEKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.pfamie.watchkitapp
        PRODUCT_NAME: PfamIE
        INFOPLIST_FILE: Apps/watchOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: PfamIE watchOS App Store

schemes:
  PfamIE:
    build:
      targets: { PfamIE: all }
    run:
      config: Debug
  PfamIE-macOS:
    build:
      targets: { PfamIE-macOS: all }
    run:
      config: Debug
  PfamIE-visionOS:
    build:
      targets: { PfamIE-visionOS: all }
    run:
      config: Debug
  PfamIE-watchOS:
    build:
      targets: { PfamIE-watchOS: all }
    run:
      config: Debug
